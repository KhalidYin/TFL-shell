name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff lint check
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

  validate-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Generate controlled outputs
        run: python -m tflshell generate -t all -o output

      - name: Validate catalog
        run: python -m tflshell validate

      - name: Validate SKILL package structure
        run: python scripts/validate_skill_package.py

      - name: Run test suite
        run: pytest -q

      - name: Check generated outputs integrity
        run: |
          if [ -f .trae/skills/tfls-shell/scripts/validate_outputs.py ]; then
            python .trae/skills/tfls-shell/scripts/validate_outputs.py
          fi
