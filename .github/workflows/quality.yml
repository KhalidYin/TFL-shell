name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Generate controlled outputs
        run: python -m tflshell generate -t all -o output

      - name: Validate catalog
        run: python -m tflshell validate

      - name: Run test suite
        run: pytest -q

      - name: Check generated outputs are committed
        run: git diff --exit-code -- output
