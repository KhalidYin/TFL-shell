[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tflshell"
version = "2.1.0"
description = "Clinical TFL Shell Template Generator v2.1 — ICH E3 Compliant Clinical Practice"
requires-python = ">=3.10"

[project.scripts]
tflshell = "tflshell.main:main"

[tool.setuptools.packages.find]
where = ["src"]
