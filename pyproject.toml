[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tflshell"
version = "2.1.0"
description = "Clinical TFL Shell Template Generator v2.1 — ICH E3 Compliant Clinical Practice"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pre-commit>=4.0.0",
]

[project.scripts]
tflshell = "tflshell.main:main"

[tool.setuptools.packages.find]
where = ["src"]
